      <stop offset="100%" stop-color="#04060D"/>
    </linearGradient>
    <linearGradient id="dac-rim" x1="128" y1="24" x2="384" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.70"/>
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="dac-cyan-blue" x1="88" y1="168" x2="424" y2="344" gradientUnits="userSpaceOnUse">
