    <path d="M196 196 C228 196, 284 316, 316 316 C348 316, 368 288, 368 256 C368 224, 348 196, 316 196 C284 196, 228 316, 196 316 C164 316, 144 288, 144 256 C144 224, 164 196, 196 196 Z"
