<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="DeepAutoCode logo">
  <title>DeepAutoCode</title>
  <defs>
    <linearGradient id="dac-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16233F"/>
